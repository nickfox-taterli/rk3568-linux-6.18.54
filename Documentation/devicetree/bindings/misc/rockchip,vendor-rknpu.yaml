%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/rockchip,vendor-rknpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RK3568 vendor RKNPU compatibility engine

maintainers:
  - Rockchip Linux <linux-rockchip@lists.infradead.org>

description: |
  Local binding for drivers/vendor/rknpu and the SDK RKNN runtime ABI.
  Optional mainline OPP, devfreq, OTP grading and thermal cooling are supported.

properties:
  compatible:
    items:
      - const: rockchip,rk3568-rknpu
      - const: rockchip,rknpu

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 4

  clock-names:
    items:
      - const: scmi_clk
      - const: clk
      - const: aclk
      - const: hclk

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: srst_a
      - const: srst_h

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  rknpu-supply:
    description: NPU core supply.

  operating-points-v2: true

  nvmem-cells:
    maxItems: 2

  nvmem-cell-names:
    items:
      - const: npu-grade
      - const: npu-grade-remark

  '#cooling-cells':
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - iommus

additionalProperties: false
