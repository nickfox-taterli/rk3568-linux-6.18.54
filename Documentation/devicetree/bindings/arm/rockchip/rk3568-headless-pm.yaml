%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/rockchip/rk3568-headless-pm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Local RK3568 BL31 sleep configuration bridge

maintainers:
  - Rockchip Linux <linux-rockchip@lists.infradead.org>

description: |
  Configure the existing BL31 sleep ABI before mainline PSCI system suspend.
  This is a local compatibility binding, not an upstream firmware ABI claim.

properties:
  compatible:
    const: rockchip,rk3568-headless-pm

  rockchip,sleep-mode-config:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: RK3568 firmware sleep-mode bitmask.

  rockchip,wakeup-config:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: RK3568 firmware wake-source bitmask.

  rockchip,sleep-debug-en:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: Enable BL31 sleep diagnostics on UART.

required:
  - compatible
  - rockchip,sleep-mode-config
  - rockchip,wakeup-config
  - rockchip,sleep-debug-en

additionalProperties: false
