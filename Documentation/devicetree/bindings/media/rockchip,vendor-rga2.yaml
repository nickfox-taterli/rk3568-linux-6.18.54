%YAML 1.2
---
$id: http://devicetree.org/schemas/media/rockchip,vendor-rga2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RK3568 vendor RGA2 compatibility engine

maintainers:
  - Rockchip Linux <linux-rockchip@lists.infradead.org>

description: |
  Local binding for the SDK ioctl driver in drivers/vendor/rga3.

properties:
  compatible:
    const: rockchip,rga2

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: aclk_rga
      - const: hclk_rga
      - const: clk_rga

  resets:
    maxItems: 3

  reset-names:
    items:
      - const: core
      - const: axi
      - const: ahb

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains

additionalProperties: false
